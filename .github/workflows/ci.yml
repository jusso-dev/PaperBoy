name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: paperboy-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://paperboy:paperboy@127.0.0.1:5432/paperboy
      PAPERBOY_TEST_DATABASE_URL: postgres://paperboy:paperboy@127.0.0.1:5432/paperboy
      TZ: UTC
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paperboy
          POSTGRES_PASSWORD: paperboy
          POSTGRES_USER: paperboy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperboy -d paperboy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          BETTER_AUTH_SECRET: paperboy-ci-only-secret-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
