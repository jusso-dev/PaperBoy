name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: paperboy-ci
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    env:
      PAPERBOY_DEFAULT_TIME_ZONE: Australia/Sydney
      PAPERBOY_FIXED_TIME_ZONE: Australia/Sydney
      TZ: Australia/Sydney
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paperboy
          POSTGRES_PASSWORD: paperboy
          POSTGRES_USER: paperboy
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U paperboy -d paperboy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: ghcr.io/axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
        env:
          MP_MAX_MESSAGES: "500"
          TZ: Australia/Sydney
        ports:
          - 1025/tcp
          - 8025/tcp
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        run: ./scripts/run-gitleaks.sh git --redact --verbose .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Configure service endpoints
        env:
          MAILPIT_HTTP_PORT: ${{ job.services.mailpit.ports['8025'] }}
          MAILPIT_SMTP_PORT: ${{ job.services.mailpit.ports['1025'] }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          {
            echo "DATABASE_URL=postgres://paperboy:paperboy@127.0.0.1:${POSTGRES_PORT}/paperboy"
            echo "PAPERBOY_INLINE_JOB_DISPATCH=false"
            echo "PAPERBOY_TEST_DATABASE_URL=postgres://paperboy:paperboy@127.0.0.1:${POSTGRES_PORT}/paperboy"
            echo "PAPERBOY_TEST_MAILPIT_URL=http://127.0.0.1:${MAILPIT_HTTP_PORT}"
            echo "PAPERBOY_TEST_REDIS_URL=redis://127.0.0.1:${REDIS_PORT}"
            echo "PAPERBOY_TEST_SMTP_URL=smtp://127.0.0.1:${MAILPIT_SMTP_PORT}"
            echo "REDIS_URL=redis://127.0.0.1:${REDIS_PORT}"
            echo "SMTP_URL=smtp://127.0.0.1:${MAILPIT_SMTP_PORT}"
            echo "SMTP_TLS_MODE=disabled"
          } >> "$GITHUB_ENV"

      - name: Lint OpenAPI
        run: bun run openapi:lint

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build TypeScript SDK
        run: bun run sdk:build

      - name: Check Drizzle schema
        run: bun run db:check

      - name: Validate container entrypoint
        shell: bash
        run: |
          sh -n scripts/docker-entrypoint.sh
          set +e
          output="$(PAPERBOY_PROCESS_TYPE=invalid sh scripts/docker-entrypoint.sh 2>&1)"
          status=$?
          set -e
          test "$status" -eq 64
          grep -q 'must be either web or jobs' <<< "$output"

      - name: Migrate test database
        run: bun run db:migrate

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          BETTER_AUTH_SECRET: paperboy-ci-only-secret-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000

  container:
    name: Container (linux/arm64)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/jusso-dev/paperboy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=PaperBoy

      - name: Verify public ARM64 image
        shell: bash
        run: |
          docker logout ghcr.io
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}")"
          printf '%s\n' "$manifest"
          grep -q 'Platform:.*linux/arm64' <<< "$manifest"
          docker run --rm --platform linux/arm64 --entrypoint curl \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}" --fail --version
