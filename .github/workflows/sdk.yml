name: OpenAPI SDKs

on:
  push:
    paths:
      - openapi.yaml
      - scripts/generate-sdks.sh
      - sdk-generator/**
      - .github/workflows/sdk.yml

permissions:
  contents: write

concurrency:
  group: paperboy-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache OpenAPI Generator
        uses: actions/cache@v4
        with:
          path: ~/.cache/paperboy
          key: openapi-generator-cli-7.24.0

      - name: Generate TypeScript and PHP SDKs
        run: ./scripts/generate-sdks.sh

      - name: Commit regenerated SDKs
        run: |
          git add sdks/typescript sdks/php
          if git diff --cached --quiet; then
            echo "Generated SDKs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          chore: regenerate OpenAPI SDKs

          EOF
          )"
          git push
