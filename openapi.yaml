openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: PaperBoy HTTP API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Tenant-bound transactional email API. API keys select one organization and
    one live or test environment. Stored instants and HTTP timestamps are RFC
    3339 UTC. The queue is provider-neutral: self-hosted SMTP and Cloudflare
    Email Service and Amazon SES use the same messages, limits, suppressions,
    and event model. The signed-in console renders this contract at `/app/docs`.
    The Rust CLI in `crates/paperboy` calls the same bearer-key routes.
servers:
  - url: /
    description: Same origin as the PaperBoy deployment
security:
  - bearerAuth: []
tags:
  - name: Emails
    description: Queue one message and inspect its environment-scoped state.
  - name: Events
    description: Read one message's ordered delivery lifecycle.
  - name: Open tracking
    description: Manage opt-in first-party open tracking and serve its signed pixel.
  - name: Outbound providers
    description: Select and test organization and sending-domain delivery routes.
  - name: Webhooks
    description: Configure the organization's signed event destination.
  - name: Webhook delivery
    description: Signed event payload PaperBoy posts to a configured receiver. Not a client route.
  - name: Rate limits
    description: Read and override organization live and test send caps.
  - name: Templates
    description: Store and preview organization email templates.
  - name: Audiences
    description: Manage permission-based audiences and contacts.
  - name: Broadcasts
    description: Snapshot an audience and queue one stored template.
  - name: Suppressions
    description: Block future sends to bounced, complained, or opted-out addresses.
x-paperboy-mcp:
  description: >-
    MCP is a peer interface over the same tenant-bound services. Protocol
    timestamps remain UTC and organization context always comes from the key.
  equivalents:
    sendEmail: paperboy_send_email
    sendEmailBatch: paperboy_send_email_batch
    getEmail: paperboy_get_delivery_status
    listEmailEvents: paperboy_list_message_events
    getOpenTracking: paperboy_get_open_tracking
    updateOpenTracking: paperboy_update_open_tracking
    getOutboundProviders: paperboy_get_outbound_providers
    updateOutboundProviders: paperboy_update_outbound_providers
    testOutboundProvider: paperboy_test_outbound_provider
    ingestOutboundProviderEvent: paperboy_ingest_outbound_provider_event
    getWebhook: paperboy_get_webhook
    configureWebhook: paperboy_configure_webhook
    getRateLimits: paperboy_get_rate_limits
    updateRateLimits: paperboy_update_rate_limits
    listTemplates: paperboy_list_templates
    createTemplate: paperboy_create_template
    getTemplate: paperboy_get_template
    updateTemplate: paperboy_update_template
    deleteTemplate: paperboy_delete_template
    previewTemplate: paperboy_preview_template
    listAudiences: paperboy_list_audiences
    createAudience: paperboy_create_audience
    getAudience: paperboy_get_audience
    updateAudience: paperboy_update_audience
    deleteAudience: paperboy_delete_audience
    listContacts: paperboy_list_contacts
    createContact: paperboy_create_contact
    getContact: paperboy_get_contact
    updateContact: paperboy_update_contact
    deleteContact: paperboy_delete_contact
    importContacts: paperboy_import_contacts
    listBroadcasts: paperboy_list_broadcasts
    createBroadcast: paperboy_create_broadcast
    getBroadcast: paperboy_get_broadcast
    updateBroadcast: paperboy_update_broadcast
    pauseBroadcast: paperboy_pause_broadcast
    resumeBroadcast: paperboy_resume_broadcast
    cancelBroadcast: paperboy_cancel_broadcast
    listSuppressions: paperboy_list_suppressions
    createSuppression: paperboy_create_suppression
    getSuppression: paperboy_get_suppression
    updateSuppression: paperboy_update_suppression
    deleteSuppression: paperboy_delete_suppression
    importSuppressions: paperboy_import_suppressions
paths:
  /api/v1/emails:
    post:
      operationId: sendEmail
      tags: [Emails]
      summary: Queue one email
      description: >-
        Validates and stores one provider-neutral message. Test keys always use
        the isolated test sink. Live keys require a verified organization domain,
        active DKIM state, and configured credentials for the resolved organization
        default or domain override. Provider choice is snapshotted on the queued
        message. Cloudflare Email Service remains responsible for provider-owned
        DKIM and ARC signatures. Idempotency may be supplied in the header or JSON
        body and is active for 24 hours per API key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailInput'
      responses:
        '200':
          description: Message accepted or safely replayed under the same idempotency key.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedEmail'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was used with a different request inside its 24-hour window.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Decoded attachments exceed the 10 MiB per-message limit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: The organization reached its fixed UTC-minute environment limit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Retry-After:
              description: Whole seconds until the shared organization window resets.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/received-emails:
    post:
      operationId: receiveInboundEmail
      tags: [Emails]
      summary: Store one inbound email
      description: >-
        Accepts a raw RFC 822 `email` string or parsed from/to/subject/html/text
        fields. Live keys require at least one recipient domain to be a verified
        organization sending domain, including plus-addresses used by support
        desks. A configured organization webhook receives `email.received` with
        routing metadata only; fetch the body with GET /api/v1/received-emails/{emailId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveInboundEmailInput'
      responses:
        '201':
          description: Inbound email stored.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmailAccepted'
        '200':
          description: Identical inbound email replayed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmailAccepted'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/received-emails/{emailId}:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: getReceivedEmail
      tags: [Emails]
      summary: Get one inbound email
      description: >-
        Returns the stored inbound email for the organization and environment
        selected by the bearer key. Support desks use this after `email.received`
        to read the customer reply body.
      responses:
        '200':
          description: Stored inbound email.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedEmail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/emails/{emailId}:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: getEmail
      tags: [Emails]
      summary: Get one email
      description: >-
        Returns one message from the organization and environment selected by
        the bearer key. Attachment metadata is safe; stored bytes, hashes, and
        storage keys are never returned.
      responses:
        '200':
          description: Current message state and semantic content.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/emails/{emailId}/events:
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      operationId: listEmailEvents
      tags: [Events]
      summary: List one email's events
      description: >-
        Returns the stable UTC lifecycle ordered by creation instant and an
        internal sequence. The internal sequence is not exposed.
      responses:
        '200':
          description: Ordered message event list.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/open-tracking:
    get:
      operationId: getOpenTracking
      tags: [Open tracking]
      summary: Read organization open tracking
      description: >-
        Returns the privacy-first organization flag. It is false by default;
        current members can read it and tenant context comes from the key.
      responses:
        '200':
          description: Current organization setting with a UTC update instant.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTrackingSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateOpenTracking
      tags: [Open tracking]
      summary: Update organization open tracking
      description: >-
        Owners and admins can opt future HTML messages in or out. Enabling
        requires a public PaperBoy URL and a dedicated signing key. Plain-text
        and existing queued messages are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTrackingUpdateInput'
      responses:
        '200':
          description: Saved organization setting with a UTC update instant.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTrackingSettings'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /o/{messageId}/{signature}.gif:
    get:
      operationId: recordOpen
      tags: [Open tracking]
      summary: Fetch the signed first-party open pixel
      security: []
      description: >-
        Always returns the same uncacheable transparent GIF. A valid signed URL
        for an opted-in message records at most one opened event; invalid URLs
        reveal no message state. Fetches may originate from scanners or proxies.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signature
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: One transparent GIF regardless of token validity.
          headers:
            Cache-Control:
              description: Pixel responses are not cacheable.
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: Allows the first-party image to render in email clients.
              schema:
                type: string
                const: cross-origin
          content:
            image/gif:
              schema:
                type: string
                format: binary
        4XX:
          description: >-
            A deployment edge rejected malformed HTTP before the request
            reached PaperBoy. The application handler itself masks token and
            message validity behind the 200 GIF response.
  /api/v1/providers:
    get:
      operationId: getOutboundProviders
      tags: [Outbound providers]
      summary: Read outbound-provider routing
      description: >-
        Returns the organization default, each tenant-owned domain's effective
        route, provider capabilities, and safe readiness state. Credentials and
        provider payloads are never returned. Timestamps are UTC.
      responses:
        '200':
          description: Current provider routing and safe runtime readiness.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundProviderSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateOutboundProviders
      tags: [Outbound providers]
      summary: Update outbound-provider routing
      description: >-
        Owners and admins select the organization default, one or more sending-
        domain overrides, or both. Existing messages retain their snapshotted
        provider. Selecting an unavailable adapter never falls back to SMTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundProviderUpdateInput'
      responses:
        '200':
          description: Saved provider routing and safe runtime readiness.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundProviderSettings'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/providers/test:
    post:
      operationId: testOutboundProvider
      tags: [Outbound providers]
      summary: Test one outbound provider
      description: >-
        Owners and admins perform a connection test with operator-injected
        credentials. The request never accepts a credential or secret reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundProviderTestInput'
      responses:
        '200':
          description: The provider accepted the connection test.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundProviderTestResult'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Credentials are missing or invalid, the adapter is unavailable, or the connection failed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/providers/aws-ses/events:
    post:
      operationId: ingestAwsSesEvent
      tags: [Outbound providers]
      summary: Ingest one Amazon SES event
      description: >-
        Owners and admins ingest one bounded SES SNS notification or EventBridge
        event through the organization-bound API key. PaperBoy verifies message
        correlation, stores only safe event metadata, updates hard-bounce or
        complaint suppressions, and replays the same provider event idempotently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsSesEventInput'
      responses:
        '202':
          description: Event accepted or safely replayed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundProviderEventEnvelope'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Provider event exceeds 512 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/providers/aws-ses/events/{orgId}:
    post:
      operationId: receiveAwsSesSnsEvent
      security: []
      tags: [Outbound providers]
      summary: Receive one signed Amazon SNS notification
      description: >-
        Public Amazon SNS subscription endpoint. PaperBoy requires the exact
        per-organization topic ARN, verifies the AWS certificate and SNS
        signature before ingestion, and automatically handles signed subscription
        confirmation. Configure SNS signature version 2.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/AwsSnsEnvelope'
          application/json:
            schema:
              $ref: '#/components/schemas/AwsSnsEnvelope'
      responses:
        '202':
          description: Signed notification accepted or safely replayed.
        '204':
          description: Signed subscription confirmation completed or unsubscribe confirmation acknowledged.
        '403':
          description: Topic or SNS signature verification failed.
        '404':
          description: Organization SNS endpoint is not configured.
        '422':
          description: Signed notification does not contain a valid matching SES event.
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/webhooks:
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Read webhook configuration
      description: Returns safe endpoint metadata and never returns signing secret material.
      responses:
        '200':
          description: Current configuration, or null when none exists.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReadEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: configureWebhook
      tags: [Webhooks]
      summary: Configure webhook delivery
      description: >-
        Creates or replaces the organization endpoint. A signing secret is
        returned only on first creation; later configuration returns null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfigurationInput'
      responses:
        '200':
          description: Saved endpoint and one-time signing secret state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfigurationEnvelope'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/emails/batch:
    post:
      operationId: sendEmailBatch
      tags: [Emails]
      summary: Queue one to 100 emails
      description: >-
        Accepts a JSON array of 1 to 100 send objects. Each item is validated
        independently. A fully valid batch returns 200. Mixed success returns
        207 and keeps accepted neighbors. An entirely rate-limited batch returns
        429. Attachments and Idempotency-Key are not supported on this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/SendEmailInput'
      responses:
        '200':
          description: Every item was queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBatchEnvelope'
        '207':
          description: Some items failed. Accepted neighbors remain queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBatchEnvelope'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Every item hit the organization UTC-minute cap.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Retry-After:
              description: Whole seconds until the shared organization window resets.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBatchEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rate-limits:
    get:
      operationId: getRateLimits
      tags: [Rate limits]
      summary: Read organization send-rate limits
      description: >-
        Returns operator defaults, nullable organization overrides, and the
        effective live and test caps. Tenant context comes from the key.
      responses:
        '200':
          description: Current defaults, overrides, and effective limits.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateRateLimits
      tags: [Rate limits]
      summary: Override organization send-rate limits
      description: >-
        Owners and admins set or clear live and test overrides. Pass a field as
        null to restore the operator default. The effective test cap must remain
        higher than live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitUpdateInput'
      responses:
        '200':
          description: Saved defaults, overrides, and effective limits.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitSettings'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/templates:
    get:
      operationId: listTemplates
      tags: [Templates]
      summary: List templates
      responses:
        '200':
          description: Organization templates.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTemplate
      tags: [Templates]
      summary: Create one template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
      responses:
        '201':
          description: Stored template.
          headers:
            Cache-Control:
